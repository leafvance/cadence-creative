/* ================= router ================= */
function route(){
  const r=(location.hash||"#/").slice(1)||"/";
  const parts=r.split("/").filter(Boolean);
  // guard role-specific pages
  const brandOnly=["discover","campaigns","campaign","shortlist","creator","shipments","library","clubs"], creatorOnly=["opportunities","applications","me","work","myclub","friends","kits"];
  if(parts[0]&&brandOnly.includes(parts[0])&&S.role!=="brand"&&parts[0]!=="creator"){S.role="brand";save()}
  if(parts[0]&&creatorOnly.includes(parts[0])&&S.role!=="creator"){S.role="creator";save()}
  renderNav(r);const _ac=$("#acct");_ac&&_ac.removeAttribute("open");closeModal();
  let html;
  switch(parts[0]){
    case undefined: html=vLanding();break;
    case "discover": html=vDiscover();break;
    case "creator": html=vProfile(parts[1],false);break;
    case "feed": html=vFeed();break;
    case "campaigns": html=vCampaigns();break;
    case "campaign": html=vBoard(parts[1],parts[2]==="content"?true:parts[2]==="shots"?"shots":false);break;
    case "messages": html=S.role==="creator"?vMessagesCreator(parts[1]):vMessages(parts[1]);break;
    case "friends": html=vFriends(parts[1]);break;
    case "insights": html=vInsights();break;
    case "panel": html=vPanel(parts[1]);break;
    case "level": html=S.role==="creator"?vLevel():vMissing();break;
    case "posts": html=vPosts();break;
    case "kits": html=vKits();break;
    case "kit": html=vKit(parts[1]);break;
    case "compete": html=vCompete();break;
    case "territory": html=FEATURES.territory?vTerritory():vCompete();break;
    case "challenge": html=vChallenge(parts[1]);break;
    case "shipments": html=vShipments();break;
    case "signup": html=vSignup();break;
    case "account": html=vAccount();break;
    case "tracking": html=vTracking();break;
    case "payments": html=vPayments();break;
    case "contracts": html=vContracts();break;
    case "contract": html=vContract(parts[1]);break;
    case "library": html=vLibrary();break;
    case "help": html=vHelp();break;
    case "programs": html=vPrograms(parts[1]);break;
    case "test": html=vTest(parts[1]);break;
    case "clubs": html=vClubs();break;
    case "club": html=vClub(parts[1]);break;
    case "myclub": html=vMyClub();break;
    case "calendar": html=vCalendar();break;
    case "analytics": html=vAnalytics()+(S.role==="brand"?brandKitsHTML():"");break;
    case "leaderboard": html=vLeaderboard();break;
    case "work": html=vWork(parts[1]);break;
    case "shortlist": html=vShortlist();break;
    case "opportunities": html=vOpps();break;
    case "applications": html=vApps();break;
    case "me": html=vProfile(ME_CREATOR,true);break;
    default: html=vMissing();
  }
  $("#app").innerHTML=html;
  if(parts[0]==="discover")renderResults();
}
function rerender(){const y=scrollY;route();scrollTo(0,y)}
function go(h){if(location.hash===h)route();else location.hash=h;scrollTo(0,0)}
addEventListener("hashchange",()=>{route();scrollTo(0,0)});

/* ================= events ================= */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-action]");
  if(e.target.id==="scrim"){closeModal();return}
  if(!t)return;
  const a=t.dataset.action,id=t.dataset.id;
  if(handleV8(a,t,id)||handleV7(a,t,id)||handleV6(a,t,id)||handleV5(a,t,id)||handleV4(a,t,id)||handleV3(a,t,id)||handleV2(a,t,id))return;
  switch(a){
    case "role":{S.role=t.dataset.role;save();const seg=((location.hash||"").split("/")[1]||"");typingThread=null;go(["feed","messages","calendar","analytics","leaderboard","programs","account","tracking","payments","contracts","help","signup","compete","insights","posts","territory"].includes(seg)?"#/"+seg:(S.role==="brand"?"#/discover":"#/opportunities"));break}
    case "start":S.role=t.dataset.role;save();go(S.role==="brand"?"#/discover":"#/opportunities");break;
    case "short":{const i=S.shortlist.indexOf(id);if(i>-1){S.shortlist.splice(i,1);toast("Removed from shortlist")}else{S.shortlist.push(id);toast(cr(id).name+" added to shortlist")}save();if($("#results"))renderResults();else rerender();break}
    case "clearf":F.sports.clear();F.types.clear();F.size="any";F.q="";F.loc="";F.sort="match";F.soon=false;rerender();break;
    case "togglef":filtersOpen=!filtersOpen;$(".filters").classList.toggle("open",filtersOpen);break;
    case "like":{const i=S.liked.indexOf(id);i>-1?S.liked.splice(i,1):S.liked.push(id);save();rerender();break}
    case "feedsport":feedSport=t.dataset.s;rerender();break;
    case "oppsport":oppSport=t.dataset.s;rerender();break;
    case "invite":mInvite(id);break;
    case "apply":mApply(id);break;
    case "newcamp":mNewCamp();break;
    case "compose":mCompose();break;
    case "editme":mEditMe();break;
    case "close":closeModal();break;
    case "tog":t.classList.toggle("on");break;
    case "move":{const x=S.apps.find(z=>z.id===id);x.status=t.dataset.to;if(x.status==="hired"){if(!dlvFor(x.id).length)createDeliverables(x);createContract(x);sysMsg(ME_BRAND,x.creator,`You're hired for ${camp(x.camp).title}. ${money(x.rate||0)} is funded in escrow.`,x.camp)}save();rerender();
      toast({shortlisted:cr(x.creator).name+" shortlisted",hired:cr(x.creator).name+" hired. "+money(x.rate||0)+" held in escrow",declined:"Application declined",applied:"Moved back to applied"}[t.dataset.to]);break}
    case "decline-inv":{S.apps=S.apps.filter(z=>z.id!==id);save();rerender();toast("Invitation declined");break}
    case "do-invite":{const sel=document.querySelector('input[name="ic"]:checked');if(!sel){toast("Pick a campaign first");break}
      const off=Number($("#ioff").value)||null,note=$("#imsg").value.trim();S.apps.push({id:"a"+(S.seq++),camp:sel.value,creator:id,status:"invited",rate:off,pitch:"",date:"2026-09-28"});sysMsg(ME_BRAND,id,`Invited to ${camp(sel.value).title}${off?" with an offer of "+money(off):""}.${note?" "+note:""}`,sel.value);save();closeModal();rerender();toast("Invite sent to "+cr(id).name);break}
    case "do-apply":{const p=$("#pitch").value.trim(),r=Number($("#rate").value);
      if(p.length<20){$("#aerr").textContent="Write at least a sentence or two so the brand knows what you'd make.";break}
      if(!r&&needsRate(camp(id))){$("#aerr").textContent="Add your flat fee in USD.";break}
      const ex=myApp(id);
      if(ex){ex.status="applied";ex.pitch=p;ex.rate=r;ex.date="2026-09-28"}else S.apps.push({id:"a"+(S.seq++),camp:id,creator:ME_CREATOR,status:"applied",rate:r,pitch:p,date:"2026-09-28"});
      save();closeModal();rerender();toast("Application sent to "+BRANDS[camp(id).brand].name);break}
    case "do-newcamp":{const title=$("#nt").value.trim(),sports=[...document.querySelectorAll("#nsp .chip.on")].map(b=>b.dataset.s);
      if(!title){$("#nerr").textContent="Give the campaign a name.";break}
      if(!sports.length){$("#nerr").textContent="Pick at least one sport so the right creators see it.";break}
      const k={id:"k"+(S.seq++),brand:ME_BRAND,title,sports,types:[],deliv:$("#nd").value.trim()||"To be agreed with creator",budget:$("#nb").value.trim()||"Open to quotes",due:$("#ndue").value||"2026-11-30",brief:$("#nbr").value.trim()||"Brief coming soon.",minLevel:Number($("#nlv").value)||0,pay:{flat:$("#pm-flat").checked,pct:$("#pm-pct").checked?Number($("#pv-pct").value)||0:0,spendPct:$("#pm-ad").checked?Number($("#pv-ad").value)||0:0,cpm:$("#pm-cpm").checked?Number($("#pv-cpm").value)||0:0,cap:$("#pm-cpm").checked?Number($("#pv-cap").value)||0:0}};
      if(!k.pay.flat&&!k.pay.pct&&!k.pay.spendPct&&!k.pay.cpm){$("#nerr").textContent="Pick at least one way to pay.";break}
      S.camps.unshift(k);save();closeModal();go("#/campaign/"+k.id);toast("Campaign posted");break}
    case "do-post":{const txt=$("#pt").value.trim();if(!txt){$("#perr").textContent="Write something before publishing.";break}
      const kind=$("#pm").value;
      S.posts.unshift({id:"p"+(S.seq++),creator:ME_CREATOR,text:txt,sport:$("#ps").value,media:kind?{kind,cap:$("#pc").value.trim()||"New "+kind.toLowerCase(),dur:kind==="Video"?"0:45":""}:null,likes:0,ago:"now"});
      save();closeModal();rerender();toast("Post published");break}
    case "do-editme":{S.me.bio=$("#eb").value.trim()||S.me.bio;S.me.loc=$("#el").value.trim()||S.me.loc;S.me.from=Number($("#er").value)||S.me.from;save();closeModal();rerender();toast("Profile saved");break}
    case "reset":S=fresh();save();rpSport="All";terrCity=MY_CITY;terrSel=null;terrPick=null;terrMode="own";IS.scope=null;IS.all=false;chHostF="all";frTab="friends";frQuery="";calFriendsOnly=false;SU={step:0,role:null,d:{},conn:{},files:{}};Object.assign(LF,{creator:"all",src:"all",rights:"all",kind:"all",q:""});shipFilter="action";anPeriod="90d";lbMetric="gmv";calMonth="2026-10";calSport="All";calOpenOnly=false;F.sports.clear();F.types.clear();F.q="";F.loc="";F.size="any";go("#/");toast("Demo data reset");break;
  }
});
document.addEventListener("input",e=>{
  const f=e.target.dataset&&e.target.dataset.f;if(!f)return;
  if(f==="q")F.q=e.target.value;
  else if(f==="loc")F.loc=e.target.value;
  else return;
  renderResults();
});
document.addEventListener("change",e=>{
  const f=e.target.dataset&&e.target.dataset.f;if(!f)return;
  if(f==="sport"){e.target.checked?F.sports.add(e.target.value):F.sports.delete(e.target.value)}
  else if(f==="type"){e.target.checked?F.types.add(e.target.value):F.types.delete(e.target.value)}
  else if(f==="size")F.size=e.target.value;
  else if(f==="soon")F.soon=e.target.checked;
  else if(f==="ver")F.ver=e.target.checked;
  else if(f==="lvl")F.lvl=e.target.value;
  else if(f==="sort")F.sort=e.target.value;
  else return;
  renderResults();
});
document.addEventListener("change",e=>{const el=e.target;if(el.classList&&el.classList.contains("inl")){const k=el.dataset.k;const v=el.value;S.cDefaults[k]=/^\d+$/.test(v)?Number(v):v;save();toast("Template updated. New hires use these terms")}
  if(el.dataset&&el.dataset.lf&&el.dataset.lf!=="q"){LF[el.dataset.lf]=el.value;rerender()}});
document.addEventListener("input",e=>{const el=e.target;if(el.dataset&&el.dataset.lf==="q"){LF.q=el.value;const pos=el.selectionStart;rerender();const n=document.querySelector('[data-lf="q"]');if(n){n.focus();n.setSelectionRange(pos,pos)}}});
document.addEventListener("input",e=>{if(e.target.id==="fr-q"){frQuery=e.target.value;const pos=e.target.selectionStart;rerender();const n=$("#fr-q");if(n){n.focus();n.setSelectionRange(pos,pos)}}});
document.addEventListener("change",e=>{if(e.target.id==="fr-priv"){S.friends.privacy=e.target.value;save();toast("Friend request setting saved")}});
document.addEventListener("change",e=>{const el=e.target,d=el.dataset||{};
  if(d.is){IS[d.is]=el.value;rerender();const b=$("#breakdown");b&&b.scrollIntoView()}
  if(d.pred){IS.pred[d.pred]=el.value;const o=$("#pred-out");if(o)o.innerHTML=predHTML()}
  if(d.terr){terrCity=el.value;terrSel=null;terrPick=null;rerender()}
  if(d.pr){S.postRules[d.pr]=el.type==="checkbox"?el.checked:Number(el.value);save();toast("Monitoring rules saved")}});
document.addEventListener("click",e=>{const ac=$("#acct");if(ac&&ac.open&&!ac.contains(e.target))ac.removeAttribute("open")});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();if(e.key==="Enter"&&e.target.id==="msgin"){e.preventDefault();const b=document.querySelector('[data-action="send"],[data-action="dmsend"]');b&&b.click()}});

route();
})();
</script>
