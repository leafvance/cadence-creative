<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cadence Creative — Creator Platform Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Raleway:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#FF002B; --red-press:#d60024; --black:#000000; --white:#FFFFFF; --cream:#EAE4DC;
  --bg:#EAE4DC; --surface:#FFFFFF; --surface-2:#F5F1EC; --ink:#000000; --muted:#5E5953; --line:#D8CFC4;
  --pill-bg:#000000; --pill-ink:#FFFFFF;
  --head:'Raleway', 'Helvetica Neue', Arial, sans-serif;
  --body:'Inter', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  --r-lg:18px; --r-md:12px; --r-sm:8px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#161616; --surface-2:#0C0C0C; --ink:#FFFFFF; --muted:#A8A29B; --line:#2B2B2B;
    --pill-bg:#FFFFFF; --pill-ink:#000000;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#161616; --surface-2:#0C0C0C; --ink:#FFFFFF; --muted:#A8A29B; --line:#2B2B2B;
  --pill-bg:#FFFFFF; --pill-ink:#000000;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--head);font-weight:800;margin:0;line-height:1.02;letter-spacing:-.01em}
.up{text-transform:uppercase}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--black);color:var(--white);border-bottom:1px solid #222}
.top-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:12px 20px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--white);flex:none}
.logo .mk{width:30px;height:29px;fill:var(--red)}
.logo .wm{display:flex;flex-direction:column;gap:3px}
.logo .wm svg{width:104px;height:16px;fill:currentColor}
.logo .wm span{font:600 7.5px/1 var(--head);letter-spacing:.52em;padding-left:1px}
.nav{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:8px 13px;border-radius:999px;text-decoration:none;font:600 14px var(--head);color:#cfcac4;white-space:nowrap}
.nav a:hover{color:#fff}
.nav a.on{background:var(--red);color:#fff}
.role{display:flex;background:#1c1c1c;border-radius:999px;padding:3px;flex:none}
.role button{border:0;background:none;color:#bdb7b0;padding:6px 12px;border-radius:999px;cursor:pointer;font:600 13px var(--head)}
.role button.on{background:var(--white);color:var(--black)}
.who{display:flex;align-items:center;gap:8px;flex:none;font-size:13px;color:#cfcac4}
@media (max-width:900px){
  .top-in{flex-wrap:wrap;gap:10px 14px;padding:10px 14px}
  .nav{order:3;flex-basis:100%}
  .who{display:none}
  .role{margin-left:auto}
}

/* ---------- layout ---------- */
main{max-width:1240px;margin:0 auto;padding:28px 20px 80px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-h h1{font-size:clamp(30px,4.4vw,46px);text-transform:uppercase}
.page-h p{margin:8px 0 0;color:var(--muted);max-width:60ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* pills + buttons (from brand guide) */
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--red);color:#fff;border-radius:999px;padding:4px 11px;font:700 12px/1.3 var(--head);white-space:nowrap}
.pill.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:600}
.pill.ink{background:var(--pill-bg);color:var(--pill-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:var(--r-sm);padding:11px 18px;font:800 13px/1 var(--head);text-transform:uppercase;letter-spacing:.04em;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.red{background:var(--red);color:#fff}
.btn.red:hover{background:var(--red-press)}
.btn.ink{background:var(--pill-bg);color:var(--pill-ink)}
.btn.line{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.line:hover{border-color:var(--ink)}
.btn.sm{padding:8px 12px;font-size:11.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{border:1.5px solid var(--line);background:transparent;border-radius:var(--r-sm);width:38px;height:38px;display:inline-grid;place-items:center;cursor:pointer;color:var(--ink)}
.icon-btn.on{background:var(--red);border-color:var(--red);color:#fff}
.icon-btn svg{width:18px;height:18px}

/* avatar + banner */
.av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font:800 19px var(--head);flex:none;letter-spacing:.02em}
.av.v0{background:var(--red);color:#fff}
.av.v1{background:var(--cream);color:#000}
.av.v2{background:#000;color:#fff;box-shadow:inset 0 0 0 2px var(--red)}
.av.lg{width:112px;height:112px;font-size:38px;border:5px solid var(--surface)}
.av.sm{width:40px;height:40px;font-size:14px}
.av.xs{width:30px;height:30px;font-size:11px}
.banner{display:block;width:100%;height:100%;background:#000}

/* ---------- landing ---------- */
.hero{position:relative;background:#000;color:#fff;overflow:hidden;border-radius:var(--r-lg);min-height:560px;display:grid;grid-template-columns:1.1fr 1fr}
.hero-copy{position:relative;z-index:2;padding:56px 48px;display:flex;flex-direction:column;justify-content:flex-end;gap:22px}
.hero h1{font-size:clamp(40px,6.2vw,84px);line-height:.92;text-transform:uppercase}
.hero p{font-size:17px;color:#d8d2cb;max-width:44ch;margin:0}
.hero-img{position:relative}
.hero-img img{width:100%;height:100%;object-fit:cover;object-position:60% 40%}
.hero-img::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#000 0%,rgba(0,0,0,.15) 30%,rgba(255,0,43,.22) 100%)}
.hero-mark{position:absolute;right:-60px;top:-50px;width:340px;height:330px;fill:var(--red);opacity:.9;z-index:1;mix-blend-mode:normal}
.sports-strip{display:flex;flex-wrap:wrap;gap:10px 28px;padding:30px 4px 8px;font:800 clamp(22px,3vw,34px)/1 var(--head);text-transform:uppercase}
.sports-strip span:nth-child(even){color:var(--red)}
.how{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:28px}
.how .card{padding:28px}
.how h2{font-size:26px;text-transform:uppercase;margin-bottom:18px}
.how ol{margin:0 0 22px;padding:0;list-style:none;counter-reset:s}
.how li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.how li::before{content:counter(s);font:800 22px/1 var(--head);color:var(--red)}
.how li b{font-family:var(--head);font-weight:700}
.tagline{margin-top:40px;text-align:center;font:800 clamp(18px,2.4vw,26px) var(--head);text-transform:uppercase}
@media (max-width:860px){
  .hero{grid-template-columns:1fr;min-height:0}
  .hero-img{height:260px;order:-1}
  .hero-img::after{background:linear-gradient(0deg,#000 0%,rgba(0,0,0,.1) 60%)}
  .hero-copy{padding:8px 24px 32px}
  .hero-mark{width:180px;height:175px;right:-30px;top:-30px}
  .how{grid-template-columns:1fr}
}

/* ---------- discover ---------- */
.disc{display:grid;grid-template-columns:260px 1fr;gap:22px;align-items:start}
.filters{padding:20px;position:sticky;top:90px}
.filters h3{font-size:14px;text-transform:uppercase;margin:18px 0 10px;letter-spacing:.02em}
.filters h3:first-child{margin-top:0}
.chk{display:flex;align-items:center;gap:9px;padding:5px 0;cursor:pointer;font-size:14px}
.chk input{accent-color:var(--red);width:16px;height:16px}
.chk .n{margin-left:auto;color:var(--muted);font-size:12px}
.field{width:100%;background:var(--surface-2);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;outline:none}
.field:focus{border-color:var(--red)}
textarea.field{min-height:110px;resize:vertical}
label.lbl{display:block;font:700 13px var(--head);margin:14px 0 6px}
.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.toolbar .field{flex:1;min-width:200px}
.toolbar select.field{flex:0 0 auto;width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.cc{overflow:hidden;display:flex;flex-direction:column}
.cc-ban{height:92px;position:relative}
.cc-body{padding:0 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.cc-top{display:flex;align-items:flex-end;gap:12px;padding-top:10px;position:relative}
.cc-top .av{border:4px solid var(--surface);width:64px;height:64px;margin-top:-40px}
.cc h3{font-size:19px}
.cc .handle{font-size:13px;color:var(--muted)}
.cred{font-size:13.5px;line-height:1.45}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.stats div{padding:9px 10px;border-right:1px solid var(--line)}
.stats div:last-child{border-right:0}
.stats b{display:block;font:800 17px/1.1 var(--head)}
.stats span{font-size:11.5px;color:var(--muted)}
.cc-actions{display:flex;gap:8px;margin-top:auto}
.cc-actions .btn{flex:1}
.mob-filter{display:none}
.empty{padding:48px 24px;text-align:center}
.empty h3{font-size:22px;text-transform:uppercase;margin-bottom:8px}
@media (max-width:860px){
  .disc{grid-template-columns:1fr}
  .filters{position:static;display:none}
  .filters.open{display:block}
  .mob-filter{display:inline-flex}
}

/* ---------- profile ---------- */
.prof-ban{height:220px;border-radius:var(--r-lg);overflow:hidden;position:relative}
.prof-head{display:flex;gap:22px;align-items:flex-end;padding:14px 28px 0;position:relative;flex-wrap:wrap}
.prof-head .av.lg{margin-top:-72px}
.prof-head h1{font-size:clamp(30px,4vw,44px);text-transform:uppercase}
.prof-grid{display:grid;grid-template-columns:1fr 340px;gap:20px;margin-top:26px;align-items:start}
.sec{padding:22px}
.sec h2{font-size:18px;text-transform:uppercase;margin-bottom:12px}
.sec + .sec{margin-top:16px}
.bio{font-size:16px;max-width:64ch;margin:0}
.creds{list-style:none;margin:0;padding:0}
.creds li{padding:10px 0;border-top:1px solid var(--line);display:flex;gap:10px}
.creds li:first-child{border-top:0;padding-top:0}
.creds li::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--red);margin-top:8px;flex:none;transform:skewX(-18deg)}
.rates{width:100%;border-collapse:collapse}
.rates td{padding:10px 0;border-top:1px solid var(--line)}
.rates tr:first-child td{border-top:0}
.rates td:last-child{text-align:right;font:800 15px var(--head)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
@media (max-width:900px){.prof-grid{grid-template-columns:1fr}.prof-head{padding:0 14px}.prof-ban{height:150px}}

/* ---------- media tile ---------- */
.media{position:relative;border-radius:var(--r-md);overflow:hidden;aspect-ratio:4/5;background:#000;color:#fff}
.media.wide{aspect-ratio:16/10}
.media svg.bg{position:absolute;inset:0;width:100%;height:100%}
.media .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.85) 100%)}
.media .cap{position:absolute;left:12px;right:12px;bottom:12px;font:800 16px/1.1 var(--head);text-transform:uppercase}
.media .kind{position:absolute;top:10px;left:10px}
.media .play{position:absolute;top:50%;left:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:var(--red);display:grid;place-items:center}
.media .play svg{width:20px;height:20px;fill:#fff;margin-left:3px}

/* ---------- feed ---------- */
.feed-wrap{display:grid;grid-template-columns:1fr 320px;gap:22px;align-items:start}
.feed{display:flex;flex-direction:column;gap:16px;max-width:680px}
.post{padding:18px}
.post-h{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.post-h b{font-family:var(--head);font-weight:700}
.post p{margin:0 0 14px;font-size:15.5px}
.post .media{aspect-ratio:16/10}
.post-f{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
.like{border:0;background:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:6px 8px;border-radius:var(--r-sm);color:var(--muted);font-weight:500}
.like.on{color:var(--red)}
.like svg{width:18px;height:18px}
.composer{padding:18px}
.composer textarea{min-height:84px}
.side .sec h2{font-size:15px}
.mini{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);text-decoration:none}
.mini:first-of-type{border-top:0}
.mini b{font-family:var(--head);font-weight:700;font-size:14px;display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font:600 13px var(--head);cursor:pointer;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media (max-width:980px){.feed-wrap{grid-template-columns:1fr}.side{display:none}}

/* ---------- campaigns ---------- */
.camps{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.camp{padding:20px;display:flex;flex-direction:column;gap:12px}
.camp h3{font-size:21px;text-transform:uppercase}
.brandline{display:flex;gap:10px;align-items:center}
.blogo{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font:800 14px var(--head);flex:none}
.blogo.b0{background:#000;color:#fff;box-shadow:inset 0 0 0 1px #333}
.blogo.b1{background:var(--red);color:#fff}
.blogo.b2{background:var(--cream);color:#000}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}
.counts{display:flex;gap:6px;flex-wrap:wrap}
.board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px;min-height:220px}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 12px}
.col-h h3{font-size:14px;text-transform:uppercase}
.appc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;margin-bottom:10px}
.appc .who2{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.appc .who2 b{font-family:var(--head);font-weight:700;display:block;line-height:1.2}
.appc p{font-size:13.5px;margin:0 0 10px}
.appc .row .btn{flex:1}
.back{display:inline-flex;gap:6px;align-items:center;text-decoration:none;font:700 13px var(--head);color:var(--muted);margin-bottom:12px}
.back:hover{color:var(--ink)}
@media (max-width:900px){.board{grid-template-columns:repeat(4,82vw);scroll-snap-type:x mandatory}.col{scroll-snap-align:start}}

/* status */
.st{font:700 12px var(--head);padding:4px 10px;border-radius:999px;white-space:nowrap}
.st.invited{background:var(--cream);color:#000}
.st.applied{background:var(--pill-bg);color:var(--pill-ink)}
.st.shortlisted{background:transparent;color:var(--red);box-shadow:inset 0 0 0 1.5px var(--red)}
.st.hired{background:var(--red);color:#fff}
.st.declined{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line)}
.list{display:flex;flex-direction:column;gap:12px}
.lrow{padding:18px;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}
.lrow h3{font-size:17px;text-transform:uppercase}
@media (max-width:640px){.lrow{grid-template-columns:auto 1fr}.lrow .act{grid-column:1/-1}}

/* ---------- modal + toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.scrim.open{display:flex}
.modal{background:var(--surface);color:var(--ink);border-radius:var(--r-lg);width:min(560px,100%);max-height:88vh;overflow:auto;padding:26px;border:1px solid var(--line)}
.modal h2{font-size:24px;text-transform:uppercase;margin-bottom:6px}
.modal .foot{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1.5px solid var(--line);border-radius:var(--r-md);margin-top:8px;cursor:pointer}
.opt input{accent-color:var(--red);margin-top:4px}
.opt:has(input:checked){border-color:var(--red)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--black);color:#fff;border-left:4px solid var(--red);padding:12px 18px;border-radius:var(--r-sm);font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.demo-bar{max-width:1240px;margin:0 auto;padding:0 20px 30px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.demo-bar button{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px}

/* ================= v2 additions ================= */
.nav a .bdg{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font:700 11px var(--body);margin-left:6px;vertical-align:1px}
.nav a.on .bdg{background:#fff;color:var(--red)}
@media (max-width:1380px){.who{display:none}}
@media (max-width:1180px){
  .top-in{flex-wrap:wrap;gap:10px 14px;padding:10px 14px}
  .nav{order:3;flex-basis:100%}
  .role{margin-left:auto}
}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs a{padding:10px 14px;text-decoration:none;font:700 14px var(--head);color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a.on{color:var(--ink);border-color:var(--red)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:999px;cursor:pointer;font:600 13px var(--head);color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}

/* messages */
.msg-wrap{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 230px);min-height:480px;overflow:hidden}
.threads{border-right:1px solid var(--line);overflow-y:auto}
.th{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);text-decoration:none;align-items:flex-start}
.th:hover{background:var(--surface-2)}
.th.on{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--red)}
.th b{font-family:var(--head);font-weight:700;font-size:14.5px}
.th .prev{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.th .dot{width:9px;height:9px;border-radius:50%;background:var(--red);flex:none;margin-top:6px}
.conv{display:flex;flex-direction:column;min-width:0}
.conv-h{display:flex;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.conv-h b{font-family:var(--head);font-weight:700}
.conv-h .back{display:none}
@media (max-width:820px){.conv-h .back{display:inline-flex}}
.msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:72%;padding:10px 14px;border-radius:16px;font-size:14.5px;line-height:1.45}
.bub.them{background:var(--surface-2);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.bub.me{background:var(--red);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}

.bub.sys{align-self:center;background:transparent;border:1px dashed var(--line);color:var(--muted);font-size:13px;text-align:center}
.typing{align-self:flex-start;color:var(--muted);font-size:13px}
.send{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line)}

@media (max-width:820px){

  .threads{border-right:0}
}

/* deliverables + escrow */
.escrow{padding:18px 20px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;margin-bottom:18px}
.bar{height:10px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--red)}
.bar i.b{background:var(--ink)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--c,var(--red))}
.dlvs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.dlv{padding:16px;display:flex;flex-direction:column;gap:12px}
.dlv h3{font-size:16px;text-transform:uppercase}
.dlv .media{aspect-ratio:16/10}
.fb{border-left:3px solid var(--red);padding:6px 10px;font-size:13.5px;background:var(--surface-2);border-radius:0 6px 6px 0}
.fb small{display:block;color:var(--muted);font-size:11.5px}
.st.review{background:var(--pill-bg);color:var(--pill-ink)}
.st.changes{background:transparent;color:var(--red);box-shadow:inset 0 0 0 1.5px var(--red)}
.st.approved{background:var(--red);color:#fff}
.st.todo{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line)}

/* calendar */
.cal-wrap{display:grid;grid-template-columns:1fr 360px;gap:20px;align-items:start}
.cal{padding:16px}
.cal-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cal-h h2{font-size:24px;text-transform:uppercase;flex:1}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-dow{font:700 12px var(--head);color:var(--muted);padding:4px 6px}
.cal-day{min-height:96px;border:1px solid var(--line);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:3px;background:var(--surface-2)}
.cal-day.out{opacity:.35}
.cal-day.today{border-color:var(--red)}
.cal-day .d{font:700 12px var(--head)}
.ev{border:0;text-align:left;cursor:pointer;border-radius:5px;padding:3px 6px;font:600 11.5px/1.25 var(--body);background:var(--red);color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}
.ev.due{background:var(--pill-bg);color:var(--pill-ink)}
.ev.mine{background:transparent;color:var(--red);box-shadow:inset 0 0 0 1.5px var(--red)}
.more{font-size:11px;color:var(--muted);padding-left:4px}
.up-list .item{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.up-list .item:first-of-type{border-top:0}
.datebox{border-radius:10px;background:var(--red);color:#fff;text-align:center;padding:6px 0;font-family:var(--head)}
.datebox.due{background:var(--pill-bg);color:var(--pill-ink)}
.datebox b{display:block;font-size:20px;font-weight:800;line-height:1}
.datebox span{font-size:11px;font-weight:700;text-transform:uppercase}
.item b.t{font-family:var(--head);font-weight:700;display:block}
@media (max-width:1000px){.cal-wrap{grid-template-columns:1fr}}
@media (max-width:700px){.cal{display:none}}

/* analytics */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.kpi{padding:16px 18px}
.kpi span{font-size:13px;color:var(--muted);display:block}
.kpi b{display:block;font:800 clamp(22px,2.4vw,30px)/1.15 var(--head);margin-top:4px}
.kpi small{font-size:12px;color:var(--muted)}
.kpi.hi{background:var(--red);border-color:var(--red);color:#fff}
.kpi.hi span,.kpi.hi small{color:rgba(255,255,255,.85)}
.kpis.sub{grid-template-columns:repeat(5,1fr)}
.kpis.sub .kpi b{font-size:20px}
.an-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-top:16px;align-items:start}
.chart svg{width:100%;height:auto;display:block}
.chart .ax{fill:var(--muted);font:500 12px var(--body)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .s0{fill:var(--red)}.chart .s1{fill:var(--ink)}.chart .s2{fill:#B8AFA4}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:620px}
.tbl th{text-align:left;font:700 12px var(--head);color:var(--muted);padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.tbl .who3{display:flex;gap:10px;align-items:center}
.tbl .who3 b{font-family:var(--head);font-weight:700}
.hb{display:grid;grid-template-columns:120px 1fr 56px;gap:10px;align-items:center;padding:6px 0;font-size:13.5px}
.hb .tr{height:12px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--red);border-radius:6px}
.hb b{text-align:right;font-family:var(--head)}
.ms{padding:12px 0;border-top:1px solid var(--line)}
.ms:first-of-type{border-top:0}
.ms .row{justify-content:space-between}
.ms b{font-family:var(--head);font-weight:700}
.ms .bar{margin-top:8px}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.kpis.sub{grid-template-columns:repeat(3,1fr)}.an-grid{grid-template-columns:1fr}}
@media (max-width:520px){.kpis.sub{grid-template-columns:repeat(2,1fr)}}

/* leaderboard */
.contest{background:#000;color:#fff;border-radius:var(--r-lg);padding:26px;position:relative;overflow:hidden;margin-bottom:18px}
.contest svg.pt{position:absolute;inset:0;width:100%;height:100%;opacity:.35}
.contest > *:not(svg){position:relative}
.contest h2{font-size:clamp(26px,3.4vw,40px);text-transform:uppercase}
.contest .prizes{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.contest .prizes span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);padding:8px 12px;border-radius:10px;font:600 13px var(--head)}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:14px;align-items:end;margin-bottom:18px}
.pod{padding:20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.pod .rk{font:800 44px/1 var(--head);color:var(--red)}
.pod.first{background:var(--red);border-color:var(--red);color:#fff;padding:28px 20px}
.pod.first .rk{color:#fff}
.pod.first .muted{color:rgba(255,255,255,.85)}
.pod .val{font:800 22px var(--head)}
.pod.me,.tbl tr.me td{box-shadow:inset 0 0 0 2px var(--red)}

.chg{font:700 12px var(--head)}
.chg.upc{color:#1f9d55}.chg.dn{color:var(--red)}
.callout{padding:16px 18px;margin-bottom:18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-left:4px solid var(--red)}
.callout b{font-family:var(--head)}

/* ================= v3: shipping ================= */
.ships{display:flex;flex-direction:column;gap:16px}
.shipc{padding:20px;display:flex;flex-direction:column;gap:16px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);position:relative}
.steps li{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;font-size:13px;color:var(--muted)}
.steps li::before{content:"";position:absolute;top:8px;left:-50%;width:100%;height:3px;background:var(--line);z-index:0}

.steps li.done::before{background:var(--red)}
.steps .sd{width:19px;height:19px;border-radius:50%;background:var(--surface);border:3px solid var(--line);position:relative;z-index:1}
.steps li.done .sd{background:var(--red);border-color:var(--red)}
.steps li.cur .sd{box-shadow:0 0 0 4px color-mix(in srgb,var(--red) 25%,transparent)}
.steps li.done b{color:var(--ink)}
.steps b{font:700 13px var(--head)}
.steps small{font-size:11.5px}
.ship-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:18px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}

.items{list-style:none;margin:0;padding:0}
.items li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:14px}
.items b{font-family:var(--head)}
.late{color:var(--red);font-weight:600}
.st.ship-requested{background:var(--cream);color:#000}
.st.ship-approved{background:var(--pill-bg);color:var(--pill-ink)}
.st.ship-shipped{background:transparent;color:var(--red);box-shadow:inset 0 0 0 1.5px var(--red)}
.st.ship-delivered{background:var(--red);color:#fff}
.st.ship-declined{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line)}
.prodopt{align-items:center;flex-wrap:wrap}
.prodopt input[type=checkbox]{margin-top:0}
@media (max-width:760px){.ship-grid{grid-template-columns:1fr 1fr}.ship-grid > div:first-child{grid-column:1/-1}.steps small{display:none}}

/* ================= v4 ================= */
.acct{position:relative;flex:none}
.acct summary{list-style:none;cursor:pointer;display:flex!important;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-radius:999px;background:#1c1c1c;color:#e8e3dd;font:600 13px var(--head)}

.acct .menu{position:absolute;right:0;top:calc(100% + 8px);min-width:250px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r-md);padding:8px;box-shadow:0 14px 40px rgba(0,0,0,.35);z-index:40}

@media (max-width:1400px){.top-in{flex-wrap:wrap;gap:10px 14px;padding:10px 14px}.nav{order:3;flex-basis:100%}.role{margin-left:auto}}
.rt{font:600 13px var(--head);white-space:nowrap}
.star{color:var(--red)}

.stars{display:inline-flex;flex-direction:row-reverse;gap:2px}

.stars input:focus-visible + label{outline:2px solid var(--red);outline-offset:2px;border-radius:4px}
.rrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.vbadge{display:inline-flex;align-items:center;gap:5px;font:700 12px var(--head);color:var(--red);white-space:nowrap}
.vbadge svg{width:17px;height:17px;fill:var(--red)}
.credrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.credrow:first-child{border-top:0}
.credrow b{font-family:var(--head);font-weight:700}
.creds li.v{justify-content:space-between}
.creds .src{font-size:12px;color:var(--muted);white-space:nowrap;margin-left:auto;padding-left:8px}
.creds .src.ok{color:var(--red);font-weight:600}
.conn-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.conn-grid.one{grid-template-columns:1fr}
.conn{display:flex;align-items:center;gap:12px;padding:14px}
.conn b{font-family:var(--head)}
.conn.on{border-color:var(--red)}
.ptile{width:42px;height:42px;border-radius:12px;background:var(--pill-bg);color:var(--pill-ink);display:grid;place-items:center;font:800 14px var(--head);flex:none}

@media (max-width:700px){.conn-grid{grid-template-columns:1fr}}
.su-wrap{max-width:640px;margin:0 auto}
.su-card{padding:28px}

.su-steps li{flex:1;min-width:92px;font:600 12px var(--head);color:var(--muted);display:flex;flex-direction:column;gap:6px;border-top:4px solid var(--line);padding-top:8px}
.su-steps li span{display:none}

.su-role b{font:800 17px var(--head)}

.field.sm-in{padding:7px 9px;font-size:13px;min-width:200px}

.doc{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:22px;position:relative;overflow:hidden}
.doc-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:14px}
.doc .logo .mk{width:26px;height:25px;fill:var(--red)}
.doc .logo .wm svg{width:92px;height:14px}

.doc-parties{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.paid-stamp{position:absolute;right:22px;top:96px;transform:rotate(-12deg);border:3px solid var(--red);color:var(--red);font:800 22px var(--head);padding:2px 12px;border-radius:6px;opacity:.8}
.contract{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:clamp(22px,4vw,48px);max-width:820px;font-size:15px;line-height:1.65}
.contract h2{font-size:clamp(24px,3vw,32px);text-transform:uppercase;margin-bottom:14px}
.contract h3{font:800 15px var(--head);text-transform:uppercase;margin:22px 0 6px}
.contract p{margin:0 0 8px;max-width:72ch}
.contract ul{margin:0 0 8px;padding-left:20px}
.contract .ph{color:var(--red);font-weight:600}
.contract select.inl{background:var(--surface-2);border:1.5px solid var(--red);border-radius:6px;padding:2px 6px;font:700 14px var(--body);color:var(--ink)}

.libc-b{display:flex;flex-direction:column;gap:6px;padding:0 4px 4px}

.chip.avchip{display:inline-flex;align-items:center;gap:6px;padding:3px 12px 3px 3px}

.mbar{position:relative;margin-top:12px;padding:6px 0}

/* ================= v2: charts ================= */
function stackChart(labels,series,fmt){
  const W=640,H=250,pl=56,pb=28,pt=14,cw=(W-pl-10)/labels.length;
  const tot=labels.map((_,i)=>series.reduce((a,s)=>a+s.values[i],0));const max=Math.max(1,...tot)*1.12;
  const step=Math.pow(10,Math.floor(Math.log10(max/4)));const tick=Math.ceil(max/4/step)*step;
  let g="";for(let v=0;v<=max;v+=tick){const y=H-pb-(v/max)*(H-pb-pt);g+=`<line class="gl" x1="${pl}" x2="${W-6}" y1="${y}" y2="${y}"/><text class="ax" x="${pl-8}" y="${y+4}" text-anchor="end">${fmt(v)}</text>`}
  let bars="";labels.forEach((l,i)=>{let y0=H-pb;const x=pl+i*cw+cw*.22,w=cw*.56;
    series.forEach((s,si)=>{const h=s.values[i]/max*(H-pb-pt);if(h>0){bars+=`<rect class="s${si}" x="${x}" y="${y0-h}" width="${w}" height="${h}" rx="3"><title>${esc(s.name)} ${esc(l)}: ${fmt(s.values[i])}</title></rect>`;y0-=h}});
    bars+=`<text class="ax" x="${x+w/2}" y="${H-8}" text-anchor="middle">${l}</text>`});
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Chart by month">${g}${bars}</svg>${series.length>1?`<div class="legend">${series.map((s,i)=>`<span style="--c:${["var(--red)","var(--ink)","#B8AFA4"][i]}">${esc(s.name)}</span>`).join("")}</div>`:""}</div>`;
}
function hbars(rows,fmt){const max=Math.max(...rows.map(r=>r.v),0.0001);return rows.map(r=>`<div class="hb"><span>${esc(r.l)}</span><span class="tr"><i style="width:${r.v/max*100}%"></i></span><b>${fmt(r.v)}</b></div>`).join("")}
const kpi=(l,v,s,hi)=>`<div class="card kpi ${hi?"hi":""}"><span>${l}</span><b>${v}</b>${s?`<small>${s}</small>`:""}</div>`;

function vAnCreator(){
  const cut=PERIODS[anPeriod][0];

  const pays=S.payouts.filter(p=>p.creator===ME_CREATOR);
  const flat=MONTHS.map((_,i)=>FLAT_C1[i]+(i===5?pays.filter(p=>p.date>="2026-09-01").reduce((s,p)=>s+p.amount,0):0));
  const bon=bonusesFor(ME_CREATOR);const bonM=MONTHS.map((_,i)=>bon.filter(b=>b.month===i).reduce((s,b)=>s+b.amount,0));
  const comM=MONTHS.map((_,i)=>VIDEOS.filter(v=>v.creator===ME_CREATOR&&v.month===i).reduce((s,v)=>s+v.commission,0));

/* ================= v2: event handling ================= */
function handleV2(a,t,id){
  switch(a){
    case "msg":{closeModal();const th=ensureThread(ME_BRAND,id,null);save();go("#/messages/"+th.id);return true}
    case "msgbrand":{const th=ensureThread(id,ME_CREATOR,null);save();go("#/messages/"+th.id);return true}
    case "send":{const inp=$("#msgin");const txt=inp.value.trim();if(!txt){inp.focus();return true}
      const th=S.threads.find(x=>x.id===id);const me=S.role;const other=me==="brand"?"creator":"brand";
      th.msgs.push({from:me,text:txt,t:nowStamp()});save();typingThread=th.id;rerender();$("#msgin")&&$("#msgin").focus();
      setTimeout(()=>{const pool=REPLIES[other];th.msgs.push({from:other,text:pool[th.msgs.length%pool.length],t:nowStamp()});typingThread=null;
        if(location.hash==="#/messages/"+th.id&&S.role===me){save();rerender();$("#msgin")&&$("#msgin").focus()}else{th.unread[me]++;save();renderNav((location.hash||"#/").slice(1))}},1600);
      return true}
    case "approve":{const d=S.dlv.find(x=>x.id===id);const ap=S.apps.find(x=>x.id===d.app);d.status="approved";
      S.payouts.push({creator:ap.creator,brand:camp(ap.camp).brand,amount:d.amount,date:TODAY,dlv:d.id});
      sysMsg(camp(ap.camp).brand,ap.creator,`${d.title} approved. ${m0(d.amount)} released from escrow.`,ap.camp);
      save();rerender();toast(`Approved. ${m0(d.amount)} released to ${cr(ap.creator).name.split(" ")[0]}`);return true}
    case "reqchg":mReqChg(id);return true;
    case "do-reqchg":{const txt=$("#rc").value.trim();if(!txt){$("#rcerr").textContent="Tell the creator what to change.";return true}
      const d=S.dlv.find(x=>x.id===id);const ap=S.apps.find(x=>x.id===d.app);d.status="changes";d.feedback.push({text:txt,date:TODAY});
      sysMsg(camp(ap.camp).brand,ap.creator,`Changes requested on ${d.title}: "${txt}"`,ap.camp);save();closeModal();rerender();toast("Feedback sent");return true}
    case "upload":mUpload(id);return true;
    case "do-upload":{const d=S.dlv.find(x=>x.id===id);const ap=S.apps.find(x=>x.id===d.app);const f=$("#uf").files[0];
      const cap=$("#uc").value.trim()||(f?f.name.replace(/\.[^.]+$/,""):d.title.replace(/^.*?: /,""))+(d.versions.length?" v"+(d.versions.length+1):"");
      d.versions.push({kind:$("#uk").value,cap,note:$("#un").value.trim(),date:TODAY,tags:{format:$("#ut-f").value,hook:$("#ut-h").value,platform:$("#ut-p").value}});d.status="review";
      sysMsg(camp(ap.camp).brand,ap.creator,`Version ${d.versions.length} of ${d.title} is ready for review.`,ap.camp);save();closeModal();rerender();toast("Sent for review");return true}
    case "calnav":{let [y,m]=calMonth.split("-").map(Number);m+=Number(t.dataset.d);if(m<1){m=12;y--}if(m>12){m=1;y++}calMonth=`${y}-${String(m).padStart(2,"0")}`;rerender();return true}
    case "calsport":calSport=t.dataset.s;rerender();return true;
    case "calopen":calOpenOnly=t.checked;rerender();return true;
    case "calitem":{const ty=t.dataset.t;if(ty==="due"){go(S.role==="brand"?"#/campaign/"+id+"/content":"#/work/"+id)}else mEvent(id);return true}
    case "addevent":mAddEvent();return true;
    case "do-addevent":{const n=$("#en").value.trim(),d=$("#ed").value;if(!n||!d){$("#eerr").textContent="Add a name and a date.";return true}
      S.events.push({id:"u"+(S.seq++),creator:ME_CREATOR,name:n,sport:$("#es").value,date:d,loc:$("#el2").value.trim()||S.me.loc,detail:$("#edt").value.trim()||"Details coming soon",open:$("#eo").checked});
      calMonth=d.slice(0,7);save();closeModal();rerender();toast("Added to your calendar");return true}
    case "delevent":S.events=S.events.filter(e=>e.id!==id);save();closeModal();rerender();toast("Removed from your calendar");return true;
    case "period":anPeriod=t.dataset.p;rerender();return true;
    case "lbm":lbMetric=t.dataset.m;rerender();return true;
    case "lbb":lbBrand=t.dataset.b;rerender();return true;
    case "bonus":mBonus(id);return true;
    case "do-bonus":{const amt=Number($("#ba").value);if(!amt||amt<1){$("#berr").textContent="Enter an amount.";return true}
      const why=$("#br").value.trim()||"Bonus from Kinetic Fuel";S.bonuses.push({creator:id,brand:ME_BRAND,title:why,amount:amt,month:5});
      sysMsg(ME_BRAND,id,`Kinetic Fuel sent you a ${m0(amt)} bonus: ${why}`,null);save();closeModal();rerender();toast(`${m0(amt)} bonus sent to ${cr(id).name.split(" ")[0]}`);return true}
  }
  return false;
}

     <select class="field" id="pv${i}" aria-label="${esc(p.name)} option" style="width:auto;padding:6px 8px">${p.variants.map(v=>`<option>${esc(v)}</option>`).join("")}</select>

   <label class="lbl" for="snt">Note to ${esc(b.name)} (optional)</label><textarea class="field" id="snt" style="min-height:70px" placeholder="Flavors you prefer, when you're filming, delivery instructions"></textarea>

function mTrack(sid){const sh=S.ships.find(x=>x.id===sid);const etaDef=new Date(new Date(TODAY+"T12:00:00").getTime()+4*864e5).toISOString().slice(0,10);
  openModal(`<h2>${sh.tracking?"Edit tracking":"Add tracking"}</h2><p class="muted" style="margin:0">${esc(cr(shipCreator(sh)).name)} gets the tracking link right away.</p>
   <div class="row" style="flex-wrap:nowrap"><div style="flex:1"><label class="lbl" for="tc">Carrier</label><select class="field" id="tc">${Object.keys(CARRIERS).concat(["Other"]).map(c=>`<option ${sh.carrier===c?"selected":""}>${c}</option>`).join("")}</select></div>
   <div style="flex:2"><label class="lbl" for="tn">Tracking number</label><input class="field" id="tn" value="${esc(sh.tracking)}" placeholder="1Z999AA10123456784"></div></div>
   <label class="lbl" for="te">Estimated delivery</label><input class="field" id="te" type="date" value="${sh.eta||etaDef}">

   <label class="lbl" for="si">What happened?</label><select class="field" id="sit"><option>Package hasn't arrived</option><option>Wrong item or size</option><option>Item arrived damaged</option><option>Something else</option></select>

function hireAndPrompt(app){if(!dlvFor(app.id).length)createDeliverables(app);createContract(app)}
function handleV3(a,t,id){
  const H=(sh,s)=>{sh.status=s;sh.hist=sh.hist.filter(x=>x.s!==s);sh.hist.push({s,d:TODAY})};
  switch(a){
    case "shipf":shipFilter=t.dataset.s;rerender();return true;
    case "reqprod":mRequest(id,false);return true;
    case "do-request":{const ap=S.apps.find(x=>x.id===id),k=camp(ap.camp);const cat=PRODUCTS[k.brand]||[];
      const items=cat.map((p,i)=>$("#pp"+i).checked?{name:p.name,variant:$("#pv"+i).value,qty:Math.max(1,Math.min(10,Number($("#pq"+i).value)||1))}:null).filter(Boolean);
      const addr={name:$("#sa0").value.trim(),line1:$("#sa1").value.trim(),line2:$("#sa2").value.trim(),city:$("#sa3").value.trim(),state:$("#sa4").value.trim(),zip:$("#sa5").value.trim()};
      if(!items.length){$("#serr").textContent="Pick at least one product.";return true}
      if(!addr.name||!addr.line1||!addr.city||!addr.state||!addr.zip){$("#serr").textContent="Fill in your full name, street, city, state and ZIP.";return true}
      if($("#sasave").checked)S.me.addr=addr;
      const sh={id:"s"+(S.seq++),app:id,items,addr,needBy:$("#snb").value||k.due,notes:$("#snt").value.trim(),status:"requested",carrier:"",tracking:"",eta:"",issue:null,hist:[{s:"requested",d:TODAY}]};
      S.ships.push(sh);sysMsg(k.brand,ap.creator,`Product requested for ${k.title}: ${items.map(i=>i.qty+"x "+i.name+" ("+i.variant+")").join(", ")}. Needed by ${fmtDate(sh.needBy)}.`,k.id);
      save();closeModal();rerender();toast("Request sent to "+BRANDS[k.brand].name);return true}
    case "ship-approve":{const sh=S.ships.find(x=>x.id===id);H(sh,"approved");sysMsg(shipBrand(sh),shipCreator(sh),"Product request approved. Tracking coming soon.",null);save();rerender();toast("Request approved. Add tracking when it ships");return true}
    case "ship-decline":mShipDecline(id);return true;
    case "do-ship-decline":{const r=$("#sdr").value.trim();if(!r){$("#sderr").textContent="Tell the creator why so they can fix it.";return true}
      const sh=S.ships.find(x=>x.id===id);H(sh,"declined");sh.decline=r;sysMsg(shipBrand(sh),shipCreator(sh),`Product request declined: "${r}"`,null);save();closeModal();rerender();toast("Request declined");return true}
    case "ship-track":mTrack(id);return true;
    case "do-track":{const n=$("#tn").value.trim().replace(/\s+/g,"");if(n.length<8){$("#terr").textContent="Enter the full tracking number.";return true}
      const sh=S.ships.find(x=>x.id===id);const first=!sh.tracking;sh.carrier=$("#tc").value;sh.tracking=n;sh.eta=$("#te").value;
      if(!sh.hist.find(x=>x.s==="approved"))sh.hist.push({s:"approved",d:TODAY});
      if(sh.status!=="shipped"&&sh.status!=="delivered")H(sh,"shipped");
      sysMsg(shipBrand(sh),shipCreator(sh),`${first?"Your product shipped":"Tracking updated"}: ${sh.carrier} ${sh.tracking}${sh.eta?", arriving "+fmtDate(sh.eta):""}.`,null);
      save();closeModal();rerender();toast(first?"Marked as shipped. Tracking sent to "+cr(shipCreator(sh)).name.split(" ")[0]:"Tracking updated");return true}
    case "ship-delivered":{const sh=S.ships.find(x=>x.id===id);H(sh,"delivered");sysMsg(shipBrand(sh),shipCreator(sh),S.role==="brand"?"Marked as delivered.":`${cr(shipCreator(sh)).name.split(" ")[0]} confirmed the product arrived.`,null);save();rerender();toast(S.role==="brand"?"Marked as delivered":"Thanks. Time to film");return true}
    case "ship-issue":mShipIssue(id);return true;
    case "do-ship-issue":{const sh=S.ships.find(x=>x.id===id);const txt=$("#sit").value+($("#si").value.trim()?": "+$("#si").value.trim():"");sh.issue=txt;sysMsg(shipBrand(sh),shipCreator(sh),"Shipping problem reported: "+txt,null);save();closeModal();rerender();toast("Problem reported to "+BRANDS[shipBrand(sh)].name);return true}
    case "ship-resolve":{const sh=S.ships.find(x=>x.id===id);sh.issue=null;sysMsg(shipBrand(sh),shipCreator(sh),"Shipping problem marked resolved.",null);save();rerender();toast("Marked resolved");return true}
    case "accept-offer":{const ap=S.apps.find(x=>x.id===id);ap.status="hired";ap.date=TODAY;hireAndPrompt(ap);const k=camp(ap.camp);
      sysMsg(k.brand,ap.creator,`${cr(ap.creator).name.split(" ")[0]} accepted the offer for ${k.title}. ${money(ap.rate)} is funded in escrow.`,k.id);
      save();rerender();toast("Offer accepted. "+money(ap.rate)+" is in escrow");setTimeout(()=>mRequest(ap.id,true),350);return true}
  }
  return false;
}

function suNext(){
  const err=m=>{$("#su-err").textContent=m;return false};const g=id=>{const e=$("#"+id);return e?e.value.trim():""};

    if(!SU.d.name)return err("Add your name.");if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(SU.d.email))return err("Enter a valid email.");if(SU.d.pw.length<8)return err("Use at least 8 characters for your password.");if(!SU.d.terms)return err("Agree to the terms to continue.")}

    if(SU.role==="creator"){SU.d.handle=g("su-handle");SU.d.loc=g("su-loc");SU.d.cred=g("su-cred");if(!SU.d.sports.length)return err("Pick at least one sport.");if(!SU.d.handle)return err("Add your main social handle.")}
    if(SU.role==="brand"){SU.d.co=g("su-co");SU.d.web=g("su-web");SU.d.cat=$("#su-cat").value;if(!SU.d.co||!SU.d.web)return err("Add your company name and website.")}
    if(SU.role==="club"){SU.d.club=g("su-club");SU.d.mem=g("su-mem");SU.d.att=g("su-att");SU.d.loc=g("su-loc");SU.d.sch=g("su-sch");if(!SU.d.club)return err("Add your club or gym name.");if(!SU.d.sports.length)return err("Pick at least one sport.")}}
  if(SU.step===3&&SU.role!=="brand"&&!["instagram","facebook","tiktok"].some(p=>SU.conn[p]))return err("Connect at least one social account.");
  if(SU.step===4){if(SU.role==="brand"){if(!/^\d{2}-?\d{7}$/.test(g("su-ein")))return err("Enter a 9-digit EIN.");if(!$("#su-auth").checked)return err("Confirm you can sign for the company.")}

}

function creatorLedger(){const out=[];
  MONTHS.forEach((mo,i)=>{if(i<5){const c=VIDEOS.filter(v=>v.creator===ME_CREATOR&&v.month===i).reduce((s,v)=>s+v.commission,0);if(c)out.push({date:`2026-${String(i+5).padStart(2,"0")}-01`,from:"Cadence",desc:`Commissions, ${mo}`,amount:c,type:"Commission"})}
    if(FLAT_C1[i])out.push({date:`2026-${String(i+4).padStart(2,"0")}-24`,from:["Mat Theory","","Salt Line","Ridgeline Trail Co.","Ridgeline Trail Co."][i]||"Ridgeline Trail Co.",desc:"Flat fee released from escrow",amount:FLAT_C1[i],type:"Flat fee"})});
  S.payouts.filter(p=>p.creator===ME_CREATOR).forEach(p=>{const d=S.dlv.find(x=>x.id===p.dlv);out.push({date:p.date,from:BRANDS[p.brand].name,desc:(d?d.title:"Deliverable")+" approved",amount:p.amount,type:"Flat fee"})});
  bonusesFor(ME_CREATOR).forEach(b=>out.push({date:b.date||`2026-${String(b.month+4).padStart(2,"0")}-28`,from:b.brand?BRANDS[b.brand].name:"Cadence",desc:b.title,amount:b.amount,type:b.fromPanel?"Research":"Bonus"}));
  return out.sort((a,b)=>b.date.localeCompare(a.date)).map((x,i,arr)=>Object.assign(x,{no:"RC-2026-"+String(1000+arr.length-i)}));
}
function brandLedger(){const out=[];
  S.apps.filter(a=>a.status==="hired"&&camp(a.camp).brand===ME_BRAND).forEach(a=>out.push({date:a.date,desc:`Escrow funding: ${camp(a.camp).title}, ${cr(a.creator).name}`,amount:a.rate,fee:Math.round(a.rate*.1),type:"Invoice"}));
  MONTHS.slice(0,5).forEach((mo,i)=>{const c=VIDEOS.filter(v=>v.brand===ME_BRAND&&v.month===i).reduce((s,v)=>s+v.commission,0);out.push({date:`2026-${String(i+5).padStart(2,"0")}-01`,desc:`Creator commissions, ${mo}`,amount:c,fee:0,type:"Invoice"})});
  S.bonuses.filter(b=>b.brand===ME_BRAND&&!b.fromClaim&&!b.fromPanel).forEach(b=>out.push({date:b.date||TODAY,desc:`Bonus: ${b.title}, ${cr(b.creator).name}`,amount:b.amount,fee:0,type:"Invoice"}));

function lineChart(series){const W=640,H=220,pl=40,pb=28,pt=12;const n=Math.max(...series.map(s=>s.values.length));const x=i=>pl+(n<=1?0:i*(W-pl-16)/(n-1));const y=v=>H-pb-(v/5)*(H-pb-pt);
  let g="";for(let v=1;v<=5;v++)g+=`<line class="gl" x1="${pl}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${pl-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  const cols=["var(--red)","var(--ink)","#B8AFA4"];
  const lines=series.map((s,si)=>`<polyline fill="none" stroke="${cols[si]}" stroke-width="3" stroke-linejoin="round" points="${s.values.map((v,i)=>x(i)+","+y(v)).join(" ")}"/>${s.values.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${cols[si]}"><title>${esc(s.name)} week ${i+1}: ${v.toFixed(1)}</title></circle>`).join("")}`).join("");
  const labs=Array.from({length:n},(_,i)=>`<text class="ax" x="${x(i)}" y="${H-8}" text-anchor="middle">Wk ${i+1}</text>`).join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Average scores by week">${g}${lines}${labs}</svg><div class="legend">${series.map((s,i)=>`<span style="--c:${cols[i]}">${esc(s.name)}</span>`).join("")}</div></div>`}
function mCheckin(tid){const t=S.tests.find(x=>x.id===tid);const ts=t.testers.find(x=>x.creator===ME_CREATOR);const wk=ts.logs.length+1;const st=S.conn.creator.strava||S.conn.creator.garmin;

/* ================= v4: event handling ================= */
function handleV4(a,t,id){
  switch(a){
    case "calitem":if(t.dataset.t!=="act")return false;go(S.role==="brand"?"#/programs/clubs":"#/myclub");return true;
    case "mock":toast(t.dataset.m);return true;
    case "print":try{window.print()}catch(e){toast("Printing isn't available here")}return true;
    case "copy":copyText(t.dataset.v,t.dataset.l);return true;
    /* signup */
    case "su-role":SU.role=t.dataset.r;rerender();return true;
    case "su-next":suNext();return true;
    case "su-back":SU.step--;rerender();return true;
    case "su-conn":{const p=t.dataset.p;if(SU.conn[p]){SU.conn[p]=false;rerender();return true}t.disabled=true;t.textContent="Connecting…";setTimeout(()=>{SU.conn[p]=true;rerender();toast(PLATFORMS[p].n+" connected")},800);return true}
    case "su-finish":S.role=SU.role==="brand"?"brand":"creator";save();SU={step:0,role:null,d:{},conn:{},files:{}};go(S.role==="brand"?"#/discover":"#/opportunities");toast("Welcome to Cadence");return true;
    case "su-restart":SU={step:0,role:null,d:{},conn:{},files:{}};rerender();return true;
    /* connections */

function frState(cid){if(cid===ME_CREATOR)return "me";if(isFriend(cid))return "friend";if(S.friends.incoming.some(r=>r.from===cid))return "incoming";if(S.friends.outgoing.some(r=>r.to===cid))return "outgoing";return "none"}
function nextRace(cid){return allEvents().filter(e=>e.creator===cid&&e.date>=TODAY).sort((a,b)=>a.date.localeCompare(b.date))[0]}
function sharedRaces(cid){const mine=allEvents().filter(e=>e.creator===ME_CREATOR&&e.date>=TODAY);return allEvents().filter(e=>e.creator===cid&&e.date>=TODAY&&mine.some(m=>m.name===e.name&&m.date===e.date))}
function suggestReason(cid){const c=cr(cid),me=cr(ME_CREATOR);const sr=sharedRaces(cid);if(sr.length)return "Also racing "+sr[0].name;const m=mutuals(cid);if(m.length)return m.length+" mutual friend"+(m.length>1?"s":"")+", including "+cr(m[0]).name.split(" ")[0];
  if(c.loc.split(", ")[1]===me.loc.split(", ")[1])return "Also in "+c.loc.split(", ")[1];const sp=c.sports.find(s=>me.sports.includes(s));if(sp)return "Also into "+sp.toLowerCase();return "Popular in "+c.sports[0].toLowerCase()}
function suggestions(){return CREATORS.filter(c=>frState(c.id)==="none").map(c=>({c,score:sharedRaces(c.id).length*5+mutuals(c.id).length*2+(c.sports.some(s=>cr(ME_CREATOR).sports.includes(s))?1:0)})).sort((a,b)=>b.score-a.score).map(x=>x.c)}

function handleV5(a,t,id){
  switch(a){
    case "noop":return true;
    case "fr-add":{const c=cr(id);if(S.friends.outgoing.some(r=>r.to===id))return true;S.friends.outgoing.push({to:id,date:TODAY});save();rerender();toast("Friend request sent to "+c.name.split(" ")[0]);
      if(mutuals(id).length||sharedRaces(id).length||c.sports.some(s=>cr(ME_CREATOR).sports.includes(s)))setTimeout(()=>{if(!S.friends.outgoing.some(r=>r.to===id))return;S.friends.outgoing=S.friends.outgoing.filter(r=>r.to!==id);S.friends.list.push(id);S.friends.since[id]=TODAY;save();if(S.role==="creator")rerender();toast(c.name.split(" ")[0]+" accepted your friend request")},2600);return true}
    case "fr-accept":{S.friends.incoming=S.friends.incoming.filter(r=>r.from!==id);if(!isFriend(id))S.friends.list.push(id);S.friends.since[id]=TODAY;save();rerender();toast("You and "+cr(id).name.split(" ")[0]+" are now friends");return true}
    case "fr-decline":S.friends.incoming=S.friends.incoming.filter(r=>r.from!==id);save();rerender();toast("Request declined");return true;
    case "fr-cancel":S.friends.outgoing=S.friends.outgoing.filter(r=>r.to!==id);save();rerender();toast("Request canceled");return true;
    case "fr-menu":mFriendMenu(id);return true;
    case "fr-remove":S.friends.list=S.friends.list.filter(x=>x!==id);save();closeModal();rerender();toast("Removed from friends");return true;
    case "dm":{closeModal();let d=S.dms.find(x=>x.with===id);if(!d){d={id:"dm"+(S.seq++),with:id,unread:0,msgs:[]};S.dms.unshift(d);save()}go("#/messages/"+d.id);return true}
    case "dmsend":{const inp=$("#msgin");const txt=inp.value.trim();if(!txt){inp.focus();return true}const d=S.dms.find(x=>x.id===id);
      d.msgs.push({from:ME_CREATOR,text:txt,t:nowStamp()});save();typingThread=d.id;rerender();$("#msgin")&&$("#msgin").focus();
      setTimeout(()=>{d.msgs.push({from:d.with,text:FRIEND_REPLIES[d.msgs.length%FRIEND_REPLIES.length],t:nowStamp()});typingThread=null;if(location.hash==="#/messages/"+d.id&&S.role==="creator"){save();rerender();$("#msgin")&&$("#msgin").focus()}else{d.unread++;save();renderNav((location.hash||"#/").slice(1))}},1600);return true}
    case "calfriends":calFriendsOnly=t.checked;rerender();return true;
  }
  return false;
}

const DIMS={
 format:{l:"Format",v:["Product demo","Talking head review","Unboxing","Day in the life","Taste or fit test","Tutorial","Training montage","Race or fight day vlog"]},
 hook:{l:"Hook",v:["Brand intro","Question","POV","Data stat","Problem first","Result first"]},
 length:{l:"Length",v:["60s+","45 to 60s","0 to 15s","30 to 45s","15 to 30s"]},
 platform:{l:"Platform",v:["YouTube Shorts","Facebook","Instagram Reels","TikTok"]},
 setting:{l:"Setting",v:["Studio","Home","Gym","Road or track","Trail or race course"]},
 cta:{l:"Call to action",v:["None","Link in bio","Shop now button","Discount code on screen"]},
 audio:{l:"Audio",v:["Stock music","Trending sound","Voiceover","Talking to camera"]},
 aspect:{l:"Aspect ratio",v:["16:9","1:1","4:5","9:16"]},
 productFirst3:{l:"Product in first 3 seconds",v:["No","Yes"]},
 captions:{l:"Captions",v:["Off","On"]},
 face:{l:"Face in first 3 seconds",v:["No","Yes"]},
 tier:{l:"Creator size",v:["Macro (150K+)","Mid (50K to 150K)","Micro (under 50K)"]},
 kind:{l:"Placement",v:["Organic","Paid ad"]}};
const LEN_SEC={"0 to 15s":[9,15],"15 to 30s":[16,30],"30 to 45s":[31,45],"45 to 60s":[46,60],"60s+":[61,140]};
const CAT={b1:"Endurance nutrition",b5:"Endurance nutrition",b2:"Footwear",b4:"Swim and tri gear",b3:"Combat sports gear",b6:"Combat sports gear"};
(function enrich(){const r=rng(2026);const perf=v=>v.orders/Math.max(1,v.views);const sorted=[...VIDEOS].sort((a,b)=>perf(a)-perf(b));
 sorted.forEach((v,i)=>{const p=i/(sorted.length-1);const cc=CREATORS.find(x=>x.id===v.creator);const combat=cc.sports.some(s=>["Jiu jitsu","Muay Thai","MMA"].includes(s));
  const pick=(k,w)=>{const vals=DIMS[k].v;const x=Math.max(0,Math.min(.999,p*(w||.7)+r()*.5-.1));return vals[Math.floor(x*vals.length)]};
  v.format=pick("format");v.hook=pick("hook");v.length=pick("length");v.platform=pick("platform",.4);v.setting=pick("setting",.5);if(combat&&/Road|Trail/.test(v.setting))v.setting="Gym";
  v.cta=pick("cta",.6);v.audio=pick("audio",.5);v.aspect=pick("aspect",.5);v.productFirst3=pick("productFirst3",.8);v.captions=pick("captions",.6);v.face=pick("face",.5);
  v.tier=cc.followers>=150000?"Macro (150K+)":cc.followers>=50000?"Mid (50K to 150K)":"Micro (under 50K)";
  const T={end:{"Race or fight day vlog":["Race-day fueling","Aid station reset","3am at mile 78","Race week vlog"],"Day in the life":["What I eat on a 30 mile day","Pre-race breakfast","A day of heat training"],"Tutorial":["Gel timing explained","How I fuel a 50K","Recovery after a 50K"],"Taste or fit test":["Taste test with my run club","Every flavor, ranked"],"Talking head review":["Why I switched","Honest review after 500 miles"],"Training montage":["Long run montage","Heat training routine"],"Unboxing":["Unboxing my race kit","Race week haul"],"Product demo":["What's in my vest","Packing my drop bags"]},
   tri:{"Race or fight day vlog":["Race day in transition","Ironman morning"],"Day in the life":["Open water morning","Training week in Boulder"],"Tutorial":["Brick session fuel","Transition setup","Race week checklist"],"Taste or fit test":["Bottle mix taste test"],"Talking head review":["Why I switched for Ironman"],"Training montage":["Swim to bike in 60s","Long ride montage"],"Unboxing":["Race week gear unboxing"],"Product demo":["Long ride essentials"]},
   cmb:{"Race or fight day vlog":["Competition morning","Fight night vlog"],"Day in the life":["Fight camp meals","Weight cut week"],"Tutorial":["Drill of the week","Warm-up I use before rolling"],"Taste or fit test":["Gi fit test","Rashguard stretch test"],"Talking head review":["Gear I trust"],"Training montage":["Sparring day routine","Rolling in the new gear"],"Unboxing":["New gear unboxing"],"Product demo":["What's in my gym bag"]}};
  const grp=combat?"cmb":cc.sports.includes("Triathlon")?"tri":"end";const pool=T[grp][v.format];v.title=pool[Number(v.id.slice(1))%pool.length];
  const [a,b]=LEN_SEC[v.length];v.sec=Math.round(a+r()*(b-a));
  v.hookRate=Math.min(.62,.17+p*.24+r()*.07+(v.face==="Yes"?.03:0));v.holdRate=v.hookRate*(.34+p*.28)*(v.sec<=30?1.15:.9);v.completion=v.holdRate*(.45+r()*.2);
  v.eng=.022+p*.05+r()*.012;v.saves=Math.round(v.views*(.004+p*.01));v.shares=Math.round(v.views*(.002+p*.006));v.comments=Math.round(v.views*(.0015+p*.003));
  v.score=Math.round(8+p*88+r()*4);v.posted=`2026-${String(v.month+4).padStart(2,"0")}-${String(3+Number(v.id.slice(1))%24).padStart(2,"0")}`});
})();
const IMET={
 cvr:{l:"Conversion rate",f:x=>pct(x,2),c:a=>a.clicks?a.orders/a.clicks:0},
 ctr:{l:"Click-through rate",f:x=>pct(x,2),c:a=>a.views?a.clicks/a.views:0},
 hook:{l:"Hook rate (3-second views)",f:x=>pct(x),c:a=>a.views?a.hookW/a.views:0},
 hold:{l:"Hold rate (watched half)",f:x=>pct(x),c:a=>a.views?a.holdW/a.views:0},
 rpm:{l:"Sales per 1,000 views",f:m2,c:a=>a.views?a.gmv/a.views*1000:0},
 roas:{l:"ROAS on paid ads",f:x=>x.toFixed(2)+"x",c:a=>a.spend?a.gmvPaid/a.spend:0},
 cpa:{l:"Cost per order",f:m2,c:a=>a.orders?a.cost/a.orders:0,lower:true},
 eng:{l:"Engagement rate",f:x=>pct(x,2),c:a=>a.views?a.engW/a.views:0}};
function iagg(list){const a={n:list.length,views:0,clicks:0,orders:0,gmv:0,gmvPaid:0,spend:0,cost:0,hookW:0,holdW:0,engW:0};
 list.forEach(v=>{a.views+=v.views;a.clicks+=v.clicks;a.orders+=v.orders;a.gmv+=v.gmv;a.spend+=v.spend;if(v.kind==="Paid ad")a.gmvPaid+=v.gmv;a.cost+=v.commission+v.spend;a.hookW+=v.hookRate*v.views;a.holdW+=v.holdRate*v.views;a.engW+=v.eng*v.views});return a}
function iScopeList(scope){const isB=S.role==="brand";
 if(scope==="mine")return VIDEOS.filter(v=>isB?v.brand===ME_BRAND:v.creator===ME_CREATOR);
 if(scope==="category")return VIDEOS.filter(v=>CAT[v.brand]===CAT[ME_BRAND]);return VIDEOS}
function breakdown(list,dim,met){const all=IMET[met].c(iagg(list));const g={};list.forEach(v=>{const k=dim==="creator"?v.creator:v[dim];(g[k]=g[k]||[]).push(v)});
 return Object.entries(g).map(([k,l])=>{const a=iagg(l);const val=IMET[met].c(a);return {k,label:dim==="creator"?cr(k).name:k,n:l.length,views:a.views,val,lift:all?val/all-1:0}}).sort((x,y)=>IMET[met].lower?x.val-y.val:y.val-x.val)}

function insights(list){const out=[];const minN=list.length>80?8:4;

function creatorCard(c){
  const on=S.shortlist.includes(c.id);
  return `<article class="card cc">
    <div class="cc-ban">${banner(c.pat)}</div>
    <div class="cc-body">
      <div class="cc-top">${av(c)}<div><h3>${esc(c.name)}</h3><div class="handle">${esc(c.handle)}, ${esc(c.loc)}</div></div></div>
      <div class="chips">${c.sports.map(s=>`<span class="pill">${s}</span>`).join("")}</div>
      <div class="row" style="gap:10px">${levelBadge(c.id)}${rateHTML(c.id)}${isVerifiedAthlete(c.id)?VBADGE:""}</div>
      <div class="cred">${esc(c.cred)}</div>${(()=>{const e=allEvents().filter(x=>x.creator===c.id&&x.date>=TODAY).sort((a,b)=>a.date.localeCompare(b.date))[0];return e?`<div class="small muted">Next up: <b style="color:var(--ink)">${esc(e.name)}</b>, ${fmtDate(e.date)}</div>`:""})()}
      <div class="stats"><div><b>${fmtK(c.followers)}</b><span>Followers</span></div><div><b>${c.eng}%</b><span>Engagement</span></div><div><b>${money(c.from)}</b><span>From</span></div></div>
      <div class="cc-actions">
        <a class="btn ink" href="#/creator/${c.id}">View profile</a>
        <button class="icon-btn ${on?"on":""}" data-action="short" data-id="${c.id}" aria-pressed="${on}" aria-label="${on?"Remove from":"Add to"} shortlist">${on?ICON.heartF:ICON.heart}</button>
      </div>
    </div></article>`;
}

function filteredCreators(){
  let list=CREATORS.map(c=>cr(c.id)).filter(c=>{
    if(F.sports.size&&!c.sports.some(s=>F.sports.has(s)))return false;
    if(F.types.size&&![...F.types].every(t=>t in c.types))return false;
    if(F.size==="micro"&&c.followers>=50000)return false;
    if(F.size==="mid"&&(c.followers<50000||c.followers>=150000))return false;
    if(F.size==="macro"&&c.followers<150000)return false;
    if(F.loc&&!c.loc.toLowerCase().includes(F.loc.toLowerCase()))return false;
    if(F.soon&&!racingSoon(c.id))return false;
    if(F.ver&&!isVerifiedAthlete(c.id))return false;
    if(F.lvl&&levelIdx(c.id)<Number(F.lvl))return false;
    if(F.q){const q=F.q.toLowerCase();if(![c.name,c.handle,c.cred,c.bio,c.sports.join(" ")].join(" ").toLowerCase().includes(q))return false}
    return true;});
  const s={followers:(a,b)=>b.followers-a.followers,eng:(a,b)=>b.eng-a.eng,price:(a,b)=>a.from-b.from,match:(a,b)=>(b.eng*Math.log(b.followers)*(1+levelIdx(b.id)*.15))-(a.eng*Math.log(a.followers)*(1+levelIdx(a.id)*.15))}[F.sort];
  return list.sort(s);
}
function vDiscover(){
  const cnt=s=>CREATORS.filter(c=>c.sports.includes(s)).length;
  return `<div class="page-h"><div><h1>Discover creators</h1><p>Every creator here competes or coaches in their sport. Filter by discipline, content type and audience size.</p></div></div>
  <nav class="tabs" aria-label="Discover"><a href="#/discover" class="on">Creators</a><a href="#/clubs">Clubs and gyms</a></nav>
  <div class="disc">
    <aside class="card filters ${filtersOpen?"open":""}" aria-label="Filters">
      <h3>Sport</h3>${SPORTS.map(s=>`<label class="chk"><input type="checkbox" data-f="sport" value="${s}" ${F.sports.has(s)?"checked":""}>${s}<span class="n">${cnt(s)}</span></label>`).join("")}
      <h3>Content type</h3>${TYPES.map(t=>`<label class="chk"><input type="checkbox" data-f="type" value="${t}" ${F.types.has(t)?"checked":""}>${t}</label>`).join("")}
      <h3>Credentials</h3><label class="chk"><input type="checkbox" data-f="ver" ${F.ver?"checked":""}>Verified athletes only<span class="n">${CREATORS.filter(c=>isVerifiedAthlete(c.id)).length}</span></label>
      <select class="field" data-f="lvl" style="margin-top:8px" aria-label="Creator level"><option value="0">Any level</option><option value="1" ${F.lvl==1?"selected":""}>Pro and Elite</option><option value="2" ${F.lvl==2?"selected":""}>Elite only</option></select>
      <h3>Upcoming races</h3><label class="chk"><input type="checkbox" data-f="soon" ${F.soon?"checked":""}>Racing in the next 30 days<span class="n">${CREATORS.filter(c=>racingSoon(c.id)).length}</span></label>
      <h3>Audience size</h3>
      <select class="field" data-f="size">
        ${[["any","Any size"],["micro","Under 50K"],["mid","50K to 150K"],["macro","150K and up"]].map(([v,l])=>`<option value="${v}" ${F.size===v?"selected":""}>${l}</option>`).join("")}
      </select>
      <h3>Location</h3>
      <input class="field" data-f="loc" placeholder="City or state" value="${esc(F.loc)}">
      <button class="btn line sm" style="margin-top:16px;width:100%" data-action="clearf">Clear filters</button>
    </aside>
    <section>
      <div class="toolbar">
        <input class="field" type="search" data-f="q" placeholder="Search by name, race, belt or keyword" value="${esc(F.q)}" aria-label="Search creators">
        <select class="field" data-f="sort" aria-label="Sort">
          ${[["match","Best match"],["eng","Highest engagement"],["followers","Most followers"],["price","Lowest rate"]].map(([v,l])=>`<option value="${v}" ${F.sort===v?"selected":""}>${l}</option>`).join("")}
        </select>
        <button class="btn line mob-filter" data-action="togglef">Filters</button><a class="btn line" href="#/shortlist">Shortlist (${S.shortlist.length})</a>
      </div>
      <div id="results"></div>
    </section>
  </div>`;
}
function renderResults(){
  const el=$("#results");if(!el)return;
  const list=filteredCreators();
  el.innerHTML=`<p class="muted small" style="margin:0 0 12px">${list.length} creator${list.length===1?"":"s"}</p>`+
   (list.length?`<div class="grid">${list.map(creatorCard).join("")}</div>`:
   `<div class="card empty"><h3>No creators match</h3><p class="muted">Remove a filter or try a broader search.</p><button class="btn red" data-action="clearf">Clear filters</button></div>`);
}

  const port=PORTFOLIO_CAPS.slice(0,4).map((cap,i)=>({kind:i%2?"Photo":"Video",cap,dur:i%2?"":"0:3"+(i+2)}));

  return `${asOwner?"":S.role==="creator"?`<a class="back" href="#/friends">${ICON.back} Friends</a>`:`<a class="back" href="#/discover">${ICON.back} Back to creators</a>`}
  <div class="prof-ban">${banner(c.pat)}</div>

      ${isC?`<div class="card composer"><div class="row" style="align-items:flex-start;flex-wrap:nowrap">${av(cr(ME_CREATOR),"sm")}<button class="field" style="text-align:left;color:var(--muted);cursor:text" data-action="compose">Share a race plan, a result or what brands you want to work with</button></div></div>`:""}

      ${S.role==="brand"?`<section class="card sec"><h2>Your shortlist</h2><p class="muted small" style="margin:0 0 12px">${S.shortlist.length} creator${S.shortlist.length===1?"":"s"} saved</p><a class="btn ink sm" href="#/shortlist">View shortlist</a></section>`:""}

   <label class="lbl">How you'll pay</label><div class="payrow">

    <label class="chk"><input type="checkbox" id="pm-pct">% of sales</label><span class="row small"><input class="field" id="pv-pct" type="number" min="1" max="50" value="15" aria-label="Percent of sales"> of tracked sales from the creator's link or code</span>
    <label class="chk"><input type="checkbox" id="pm-ad">% of ad spend</label><span class="row small"><input class="field" id="pv-ad" type="number" min="1" max="50" value="10" aria-label="Percent of ad spend"> of what you spend running their content as ads</span>
    <label class="chk"><input type="checkbox" id="pm-cpm">CPM</label><span class="row small">$<input class="field" id="pv-cpm" type="number" min="1" value="15" aria-label="Dollars per 1,000 views"> per 1,000 organic views, up to $<input class="field" id="pv-cap" type="number" min="0" value="2000" aria-label="CPM cap"></span></div>
   <label class="lbl" for="nbr">Brief</label><textarea class="field" id="nbr" placeholder="What you want creators to show and the feeling it should leave"></textarea>
   <p class="small" id="nerr" style="margin:8px 0 0;color:var(--red)"></p>
   <div class="foot"><button class="btn line" data-action="close">Cancel</button><button class="btn red" data-action="do-newcamp">Post campaign</button></div>`);
}
function mCompose(){
  const me=cr(ME_CREATOR);
  openModal(`<h2>New post</h2><p class="muted" style="margin:0">Brands browsing the feed will see this.</p>
   <label class="lbl" for="pt">Post</label><textarea class="field" id="pt" placeholder="Racing Javelina in October and looking for a fueling partner..."></textarea>
   <div class="row" style="flex-wrap:nowrap"><div style="flex:1"><label class="lbl" for="ps">Sport</label><select class="field" id="ps">${me.sports.concat(SPORTS.filter(s=>!me.sports.includes(s))).map(s=>`<option>${s}</option>`).join("")}</select></div>
   <div style="flex:1"><label class="lbl" for="pm">Attach</label><select class="field" id="pm"><option value="">Text only</option><option>Video</option><option>Photo</option><option>Carousel</option></select></div></div>
   <label class="lbl" for="pc">Media caption</label><input class="field" id="pc" placeholder="Shown on the video or photo">
   <p class="small" id="perr" style="margin:8px 0 0;color:var(--red)"></p>

function mEditMe(){
  openModal(`<h2>Edit profile</h2>
   <label class="lbl" for="eb">Bio</label><textarea class="field" id="eb">${esc(S.me.bio)}</textarea>
   <label class="lbl" for="el">Location</label><input class="field" id="el" value="${esc(S.me.loc)}">
   <label class="lbl" for="er">Starting rate for UGC video (USD)</label><input class="field" id="er" type="number" min="0" step="25" value="${S.me.from}">
   <div class="foot"><button class="btn line" data-action="close">Cancel</button><button class="btn red" data-action="do-editme">Save profile</button></div>`);
